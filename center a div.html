<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Centered Div</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }
        .centered-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .centered-box {
            width: 200px;
            height: 100px;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            line-height: 100px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="centered-container">
        <div class="centered-box">Centered Div</div>
    </div>
</body>
</html>
